name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare Assets & Source
      run: |
        mkdir -p app/src/main/assets app/src/main/java/com/infinix/tool
        if [ -f "index.html" ]; then
          cp index.html app/src/main/assets/
        fi

        cat << 'EOF' > app/src/main/java/com/infinix/tool/MainActivity.java
        package com.infinix.tool;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import java.io.BufferedReader;
        import java.io.DataOutputStream;
        import java.io.InputStreamReader;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                setContentView(webView);
                webView.getSettings().setJavaScriptEnabled(true);
                webView.getSettings().setDomStorageEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.addJavascriptInterface(new WebAppInterface(), "AndroidHost");
                webView.loadUrl("file:///android_asset/index.html");
            }

            public class WebAppInterface {
                @JavascriptInterface
                public String executeRootCommand(String command) {
                    try {
                        Process process = Runtime.getRuntime().exec("su");
                        DataOutputStream os = new DataOutputStream(process.getOutputStream());
                        BufferedReader reader = new BufferedReader(new InputStreamReader(process.getInputStream()));
                        os.writeBytes(command + "\nexit\n");
                        os.flush();
                        StringBuilder output = new StringBuilder();
                        String line;
                        while ((line = reader.readLine()) != null) {
                            output.append(line).append("\n");
                        }
                        process.waitFor();
                        return output.toString().trim();
                    } catch (Exception e) {
                        return "Error: " + e.getMessage();
                    }
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Infinix-GT10-Tool-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
